<style>
@font-face{font-family:'Inter Tight';font-style:normal;font-display:swap;font-weight:400;src:url(fonts/inter-tight-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Inter Tight';font-style:normal;font-display:swap;font-weight:400;src:url(fonts/inter-tight-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Inter Tight';font-style:normal;font-display:swap;font-weight:500;src:url(fonts/inter-tight-latin-ext-500-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Inter Tight';font-style:normal;font-display:swap;font-weight:500;src:url(fonts/inter-tight-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Inter Tight';font-style:normal;font-display:swap;font-weight:600;src:url(fonts/inter-tight-latin-ext-600-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Inter Tight';font-style:normal;font-display:swap;font-weight:600;src:url(fonts/inter-tight-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Inter Tight';font-style:normal;font-display:swap;font-weight:700;src:url(fonts/inter-tight-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Inter Tight';font-style:normal;font-display:swap;font-weight:700;src:url(fonts/inter-tight-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --bg:#cfcfcf; --ink:#0b0b0b; --mut:#5c5c5c; --mut2:#8a8a8a; --line:rgba(0,0,0,.09);
  --tile:#4a4a4a; --yellow:#f4ce47; --yellow2:#f8df79; --orange:#eb6233; --grey:#dcdcdc; --paper:#ececec; --white:#f6f6f4;
  --r:28px; --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:'Inter Tight',system-ui,-apple-system,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 180px)}
.sp{width:44px;flex:none}
svg{display:block}

/* ---------- üst ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;height:52px;margin-bottom:14px}
.logo{font-weight:700;font-size:25px;letter-spacing:-1.6px;line-height:1;display:flex;align-items:flex-end;gap:3px}
.logo i{width:6px;height:6px;border-radius:50%;background:var(--orange);margin-bottom:4px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .15s}
.ib:active{transform:scale(.9)}
.ib svg{width:24px;height:24px}
.ib.dark{background:var(--ink);color:#fff}
.ib.soft{background:rgba(0,0,0,.07)}
.ttl{font-size:15px;font-weight:600;letter-spacing:.2px;text-transform:uppercase}

/* ---------- kasa kartı ---------- */
.bal{background:var(--ink);color:#fff;border-radius:16px;padding:22px 20px 22px 22px;display:flex;align-items:center;gap:14px}
.bal .l{flex:1;min-width:0}
.bal .lab{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;letter-spacing:.3px;text-transform:uppercase}
.bal .lab button{width:28px;height:28px;display:grid;place-items:center;margin:-6px 0;color:#fff}
.bal .lab svg{width:19px;height:19px}
.bal .amt{font-size:50px;font-weight:500;letter-spacing:-2.4px;line-height:1.05;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bal .amt .c,.bal .amt .d{color:#8f8f8f}
.bal .amt.neg{color:#ff8a65}
.bal .hint{display:inline-block;margin-top:10px;font-size:13px;color:#bdbdbd;text-decoration:underline;text-underline-offset:3px}
.bal .meta{font-size:13px;color:#a3a3a3;margin-top:8px}
.bal .go{width:66px;height:66px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;flex:none;transition:transform .15s}
.bal .go:active{transform:scale(.92)}
.bal .go svg{width:28px;height:28px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tiles button{height:104px;border-radius:10px;background:var(--tile);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:transform .15s,background .15s}
.tiles button:active{transform:scale(.96);background:#3d3d3d}
.tiles svg{width:30px;height:30px;stroke-width:1.6}
.tiles small{font-size:11px;font-weight:600;letter-spacing:.8px;color:#c8c8c8;text-transform:uppercase}

.sh{display:flex;align-items:center;justify-content:space-between;margin:30px 2px 14px}
.sh h3{font-size:16px;font-weight:700;letter-spacing:.1px;text-transform:uppercase}
.sh a,.sh button.lnk{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:4px}
.sh .lnk svg{width:14px;height:14px}
.mnav{display:flex;align-items:center;gap:6px}
.mnav button{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.08);display:grid;place-items:center}
.mnav button svg{width:16px;height:16px}
.mnav span{font-size:16px;font-weight:700;text-transform:uppercase;min-width:120px;text-align:center}

/* ---------- ay kartı (halka) ---------- */
.mcard{display:block;width:100%;background:var(--paper);border-radius:22px;padding:18px;transition:transform .15s}
.mcard:active{transform:scale(.985)}
.mcard .hd{display:flex;align-items:center;justify-content:space-between}
.mcard .hd b{font-size:15px;font-weight:700;text-transform:uppercase}
.mcard .hd span{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.mcard .hd span svg{width:20px;height:20px}
.mcard .bd{display:flex;align-items:center;gap:18px;margin-top:8px}
.ringw{position:relative;width:132px;height:132px;flex:none}
.ring{width:100%;height:100%}
.ring circle{fill:none;stroke-width:14;stroke-linecap:round;transition:stroke-dasharray .6s,stroke-dashoffset .6s}
.ringc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringc b{font-size:26px;font-weight:600;letter-spacing:-1px}
.ringc small{font-size:11px;color:var(--mut);margin-top:-1px}
.lgd{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.lgd .it small{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.5px;color:var(--mut);text-transform:uppercase}
.lgd .it small i{width:9px;height:9px;border-radius:50%;background:var(--ink)}
.lgd .it small i.o{background:var(--orange)}
.lgd .it b{display:block;font-size:22px;font-weight:600;letter-spacing:-.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.lgd .it em{display:block;font-style:normal;font-size:12px;color:var(--mut2);margin-top:1px}
.d{opacity:.45;font-size:.66em;letter-spacing:0}

/* ---------- üst üste kartlar ---------- */
.stk{display:flex;flex-direction:column}
.sc{position:relative;display:flex;flex-direction:column;width:100%;min-height:150px;border-radius:var(--r);padding:20px 18px 20px 20px;transition:transform .15s}
.sc + .sc{margin-top:-28px}
.sc:not(:last-child){padding-bottom:48px}
.sc:first-child{min-height:200px}
.sc:active{transform:translateY(2px)}
.sc .h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sc .h b{font-size:21px;font-weight:700;letter-spacing:-.2px;text-transform:uppercase;line-height:1.1;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sc .go{width:58px;height:58px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none;margin:-4px -4px 0 0}
.sc .go svg{width:26px;height:26px}
.sc .f{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:4px 10px;margin-top:auto;padding-top:16px}
.sc .f small{font-size:14px;line-height:1.25;max-width:58%;padding-bottom:6px}
.sc .f small em{font-style:normal;font-weight:700}
.sc .a{margin-left:auto;font-weight:500;letter-spacing:-.045em;line-height:.9;white-space:nowrap}
.sc-y{background:linear-gradient(180deg,var(--yellow) 0%,var(--yellow) 72%,var(--yellow2) 100%)}
.sc-y .a{color:#fff} .sc-y small{color:rgba(0,0,0,.6)}
.sc-o{background:var(--orange)} .sc-o .a{color:#fff} .sc-o small{color:rgba(255,255,255,.92)}
.sc-g{background:var(--grey)} .sc-g .a{color:#fff;text-shadow:0 0 1px rgba(0,0,0,.06)} .sc-g small{color:rgba(0,0,0,.55)}
.sc-k{background:var(--ink);color:#fff} .sc-k .a{color:#fff} .sc-k small{color:#a8a8a8} .sc-k .go{background:#fff;color:var(--ink)}
.sc-t{background:var(--tile);color:#fff} .sc-t .a{color:#fff} .sc-t small{color:#cfcfcf}
.sc-w{background:var(--white)} .sc-w .a{color:var(--ink)} .sc-w small{color:var(--mut)}
.more{display:block;width:100%;text-align:center;font-size:13px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);padding:14px 0 0}
.none{background:var(--paper);border-radius:22px;padding:22px 20px;color:var(--mut);font-size:15px;line-height:1.45}
.none b{display:block;color:var(--ink);font-weight:600;font-size:16px;margin-bottom:2px}

/* ---------- sayfa başlıkları + istatistik ---------- */
.big{font-size:42px;font-weight:700;letter-spacing:-1.8px;line-height:.98;text-transform:uppercase;margin:4px 2px 18px}
.big em{font-style:normal;color:var(--mut2)}
.stat{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:118px;border-radius:var(--r);padding:18px 20px 18px}
.stat + .stat{margin-top:-26px}
.stat:not(:last-child){padding-bottom:44px;min-height:144px}
.stat .lb{position:absolute;left:20px;top:18px;font-size:14px;font-weight:700;letter-spacing:.2px;text-transform:uppercase}
.stat .mt{position:absolute;right:20px;top:19px;font-size:12px;font-weight:600;opacity:.65}
.stat .v{font-size:50px;font-weight:500;letter-spacing:-.05em;line-height:.95;text-align:right;white-space:nowrap}
.stat-y{background:var(--yellow)} .stat-y .v{color:#fff}
.stat-o{background:var(--orange)} .stat-o .v{color:#fff} .stat-o .mt{color:#fff;opacity:.85}
.stat-g{background:var(--grey)} .stat-g .v{color:var(--ink)}
.stat-k{background:var(--ink);color:#fff}
.stat-t{background:var(--tile);color:#fff}
.note-s{font-size:13px;color:var(--mut);margin:12px 4px 0;line-height:1.4}

/* ---------- segment ---------- */
.seg{display:flex;background:rgba(0,0,0,.07);border-radius:12px;padding:4px;margin-top:18px}
.seg button{flex:1;height:42px;border-radius:9px;font-size:14px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--mut);transition:background .2s,color .2s;text-align:center}
.seg button.on{background:var(--ink);color:#fff}

/* ---------- liste ---------- */
.list{display:flex;flex-direction:column;margin-top:6px}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);width:100%}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0;text-align:left}
.row .t b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;font-size:13px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{text-align:right;flex:none}
.row .a b{display:block;font-size:16px;font-weight:600;white-space:nowrap}
.row .a small{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.row.pend .a b{color:var(--mut)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--ink);color:#fff;font-weight:700;font-size:17px}
.av svg{width:20px;height:20px}
.av.o{background:var(--orange)} .av.y{background:var(--yellow);color:var(--ink)} .av.g{background:var(--tile)} .av.w{background:var(--white);color:var(--ink)}
.chk{width:30px;height:30px;border-radius:50%;border:1.8px solid #8f8f8f;display:grid;place-items:center;flex:none;color:#fff}
.chk svg{width:16px;height:16px;opacity:0}
.chk.on{background:var(--ink);border-color:var(--ink)}
.chk.on svg{opacity:1}
.chk.ci.on{background:var(--ink)} .chk.co.on{background:var(--orange);border-color:var(--orange)}
.grp{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:22px 2px 2px;display:flex;justify-content:space-between}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.07);color:var(--mut);letter-spacing:.2px}
.badge.late{background:var(--orange);color:#fff}
.badge.soon{background:var(--yellow);color:var(--ink)}
.badge.ok{background:var(--ink);color:#fff}
.bar{height:6px;border-radius:9px;background:rgba(0,0,0,.09);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:9px}
.rtag{display:inline-flex;align-items:center;gap:4px;vertical-align:-2px}
.rtag svg{width:13px;height:13px}
.empty{text-align:center;color:var(--mut);padding:40px 16px;font-size:15px;line-height:1.5}
.empty b{display:block;color:var(--ink);font-weight:600;font-size:17px;margin-bottom:4px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 0;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:99px;padding:8px 14px;font-size:13px}
.chip b{font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.chip span{color:var(--mut)}

/* ---------- alt menü + ekle ---------- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 12px);z-index:20;width:calc(100% - 24px);max-width:456px;display:flex;gap:4px;padding:6px;border-radius:20px;background:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.nav button{flex:1;height:58px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8f8f8f;transition:background .2s,color .2s;text-align:center}
.nav button svg{width:22px;height:22px}
.nav button span{font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
.nav button.on{background:#fff;color:var(--ink)}
.fab{position:fixed;z-index:35;right:max(16px, calc(50% - 240px + 16px));bottom:calc(var(--sb) + 96px);width:64px;height:64px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.3);transition:transform .15s,bottom .3s}
.fab svg{width:28px;height:28px;stroke-width:2}
.fab:active{transform:scale(.92)}
body.in-detail .fab{bottom:calc(var(--sb) + 22px)}

/* ---------- ayrıntı ekranı ---------- */
.screen{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.screen.open{transform:none;visibility:visible}
.screen .app{padding-bottom:calc(var(--sb) + 110px)}

/* ---------- alt sayfa ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:41;width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;background:#f2f2f2;border-radius:26px 26px 0 0;padding:10px 18px calc(var(--sb) + 22px);transform:translate(-50%,105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:9px;background:#c4c4c4;margin:0 auto 14px}
.sheet h2{font-size:24px;font-weight:700;letter-spacing:-.6px;text-transform:uppercase}
.sheet .seg{background:#e2e2e2}
.sheet .sh{margin:0 0 6px}
.amt{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:22px 0 6px}
.amt span{font-size:30px;color:var(--mut2);font-weight:500}
.amt input{width:100%;max-width:280px;background:none;border:0;outline:0;font-size:52px;font-weight:500;letter-spacing:-2.2px;text-align:center;color:var(--ink)}
.amt input::placeholder{color:#c2c2c2}
.fl{display:block;margin-top:14px}
.fl > small{display:block;font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin:0 4px 6px}
.in{width:100%;height:52px;border-radius:12px;background:#e2e2e2;border:1.5px solid transparent;padding:0 14px;font-size:16px;outline:0;-webkit-appearance:none;appearance:none;color-scheme:light}
.in:focus{border-color:var(--ink)}
.in:disabled{color:var(--mut)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{display:flex;align-items:center;gap:7px;height:42px;padding:0 14px 0 6px;border-radius:99px;background:#e2e2e2;font-size:14px;font-weight:600;transition:background .15s,color .15s}
.cat i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.06)}
.cat i svg{width:15px;height:15px}
.cat.on{background:var(--ink);color:#fff}
.cat.on.o{background:var(--orange)}
.cat.on i{background:rgba(255,255,255,.16)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

<script src="veriler.js"></script>
<script>
/* =========================================================
   CF — kişisel gelir / gider · kasa
   Kasa = açılış + "Aldım" denen gelirler − "Ödedim" denen ödemeler.
   Abonelikler kasayı etkilemez (KK ekstresinde ödenir).
   Veriler cihazda (localStorage) saklanır.
   ========================================================= */
const KEY = 'cf.v1', OLD_KEY = 'cuzdan.v1', HIDE_KEY = 'cf.hide';

/* ---------- ikonlar ---------- */
const P = (d, extra='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
const I = {
  home: P('<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/>'),
  swap: P('<path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="m17 12 4 4-4 4"/><path d="M21 16H7"/>'),
  repeat: P('<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>'),
  card: P('<rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19"/><path d="M6.5 15h4"/>'),
  plus: P('<path d="M12 5v14M5 12h14"/>'),
  back: P('<path d="M19 12H5"/><path d="m11 18-6-6 6-6"/>'),
  ur: P('<path d="M7 17 17 7"/><path d="M8 7h9v9"/>'),
  down: P('<path d="M12 4v16"/><path d="m6 14 6 6 6-6"/>'),
  up: P('<path d="M12 20V4"/><path d="m6 10 6-6 6 6"/>'),
  cl: P('<path d="m15 18-6-6 6-6"/>'),
  cr: P('<path d="m9 18 6-6-6-6"/>'),
  menu: P('<path d="M4 7h16M7 12h13M10 17h10"/>'),
  eye: P('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'),
  eyeOff: P('<path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7c1.6 0 3-.4 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'),
  dots: P('<circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/>'),
  brief: P('<rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/>'),
  pen: P('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),
  bank: P('<path d="M3 10 12 4l9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 21h18"/>'),
  hand: P('<path d="M7 11V6.5a1.5 1.5 0 0 1 3 0V11"/><path d="M10 10V4.5a1.5 1.5 0 0 1 3 0V10"/><path d="M13 10V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M16 9.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-.5a6 6 0 0 1-5-2.7L4 15a1.5 1.5 0 0 1 2.4-1.8L7 14"/>'),
  pct: P('<path d="M19 5 5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>'),
  check: P('<path d="m5 12.5 4.5 4.5L19 7.5"/>', 'stroke-width="2.8"'),
  dl: P('<path d="M12 4v12"/><path d="m6 11 6 6 6-6"/><path d="M4 20h16"/>'),
  ul: P('<path d="M12 20V8"/><path d="m6 13 6-6 6 6"/><path d="M4 4h16"/>'),
  trash: P('<path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>'),
  safe: P('<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="12" cy="12" r="3.5"/><path d="M12 8.5V7M12 17v-1.5M15.5 12H17M7 12h1.5"/>'),
  x: P('<path d="M6 6l12 12M18 6 6 18"/>'),
};

/* ---------- kategoriler ---------- */
const CATS = {
  in:  [ {k:'maas', n:'Maaş', i:'brief'}, {k:'telif', n:'Telif', i:'pen'}, {k:'diger', n:'Diğer', i:'dots'} ],
  out: [ {k:'kira', n:'Kira', i:'home'}, {k:'kk', n:'KK', i:'card'}, {k:'finansman', n:'Finansman', i:'bank'}, {k:'borc', n:'Borç', i:'hand'}, {k:'kmh', n:'KMH', i:'pct'} ],
};
const EXTRA = { alacak: {k:'alacak', n:'Alacak', i:'hand'} };
const catOf = (type, k) => CATS[type].find(c => c.k === k) || EXTRA[k] || CATS.in.concat(CATS.out).find(c => c.k === k) || {k, n:k, i:'dots'};

/* ---------- yardımcılar ---------- */
const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const MSHORT = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const ymOf = s => s.slice(0,7);
const curYM = () => ymOf(todayStr());
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d||1); };
const addMonth = (ym, n) => { const d = parseD(ym+'-01'); d.setMonth(d.getMonth()+n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const mDiff = (a, b) => (+b.slice(0,4) - +a.slice(0,4))*12 + (+b.slice(5) - +a.slice(5));
const dim = ym => new Date(+ym.slice(0,4), +ym.slice(5), 0).getDate();
const monthLabel = ym => `${MONTHS[+ym.slice(5)-1]} ${ym.slice(0,4)}`;
const ymShort = ym => `${MSHORT[+ym.slice(5)-1]} ${ym.slice(0,4)}`;
const dayLabel = s => { const d = parseD(s); return `${d.getDate()} ${MSHORT[d.getMonth()]}`; };
const daysTo = s => Math.round((parseD(s) - parseD(todayStr())) / 864e5);
const NF = new Intl.NumberFormat('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmt = n => NF.format(Math.abs(n) < 0.005 ? 0 : n);
const money = n => { const [a,b] = fmt(Math.abs(n)).split(','); return `₺${a}<span class="d">,${b}</span>`; };
const moneyPlain = n => '₺' + fmt(n);
const moneyShort = n => { const [a,b] = fmt(Math.abs(n)).split(','); return '₺' + a + (b === '00' ? '' : ',' + b); };
const sum = (arr, f = x => x.amount) => arr.reduce((s,x) => s + (+f(x) || 0), 0);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const upper = s => String(s ?? '').toLocaleUpperCase('tr-TR');
const parseAmt = v => { v = String(v||'').trim().replace(/[₺\s]/g,''); if (!v) return NaN;
  if (v.includes(',')) v = v.replace(/\./g,'').replace(',', '.'); else if ((v.match(/\./g)||[]).length > 1 || /\.\d{3}$/.test(v)) v = v.replace(/\./g,'');
  return parseFloat(v); };
const amtInput = n => n ? fmt(+n).replace(/,00$/, '') : '';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
let undoFn = null;
function toast(msg, undo){
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${msg}</span>${undo ? '<button data-act="undo">Geri al</button>' : ''}`;
  undoFn = undo || null; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => { t.classList.remove('show'); undoFn = null; }, undo ? 4000 : 1900);
}

/* =========================================================
   VERİ
   ========================================================= */
const blank = () => ({ v: 3, opening: 0, kasaSet: false, tx: [], rec: [], debts: [], subs: [], cards: [] });
function load(){ try { const d = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY)); if (d && typeof d === 'object') return Object.assign(blank(), d); } catch(e){} return blank(); }
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast('Kaydedilemedi'); } }

/* ---------- düzenli kayıt yardımcıları ---------- */
const recAmt = (r, ym) => (r.over && r.over[ym] != null) ? +r.over[ym] : +r.amount;
const recActive = (r, ym) => ym >= r.start && (!r.end || ym <= r.end) && !(r.skip||[]).includes(ym);
const recDate = (r, ym) => `${ym}-${pad(Math.min(r.day||1, dim(ym)))}`;
function recInfo(r, ym){
  if (r.mode === 'count' && r.tTotal){ const i = mDiff(r.tStart || r.start, ym) + 1; return `Taksit ${Math.min(Math.max(i,1), r.tTotal)}/${r.tTotal}`; }
  if (r.mode === 'month' && r.end) return `Her ay · son ay ${ymShort(r.end)}`;
  return 'Her ay';
}
const sgn = type => type === 'in' ? 1 : -1;
const paidOf = x => sum(x.pays || []);
const remOf = x => Math.max(0, +x.amount - paidOf(x));
const isClosed = x => !!x.closed || remOf(x) <= 0.004;

/* ---------- eski verileri yeni kasa düzenine geçir ----------
   Bu aydan önceki kayıtlar "geçmiş" sayılır: tamamlanmış işaretlenir ama
   kasayı değiştirmez (açılış bakiyesi buna göre ayarlanır). Bu ay ve sonrası
   senin "Aldım / Ödedim" demeni bekler. */
function normalize(D){
  const cur = curYM() + '-01'; let delta = 0;
  for (const t of D.tx || []){ if (t._v3) continue;
    const past = !!t.date && t.date < cur; t.done = past; t.doneDate = past ? t.date : ''; t._v3 = 1;
    if (past) delta += sgn(t.type) * (+t.amount || 0); }
  for (const r of D.rec || []){ if (r._v3) continue; r.paid = r.paid || {}; delta += autoPast(r); r._v3 = 1; }
  for (const d of D.debts || []){ if (d._v3) continue; d.pays = d.pays || []; d.closed = !!d.done; delete d.done; d._v3 = 1; }
  for (const c of D.cards || []){ if (c._v3) continue; c.pays = c.pays || []; c.closed = !!c.done; delete c.done; c._v3 = 1; }
  return delta;
}
// düzenli kaydın bu aydan önceki aylarını "geçmiş" olarak tamamla; kasa etkisini döndür
function autoPast(r){
  const cur = curYM(); let delta = 0; r.paid = r.paid || {};
  for (let m = r.start, g = 0; m < cur && (!r.end || m <= r.end) && g < 1200; m = addMonth(m, 1), g++){
    if ((r.skip||[]).includes(m) || r.paid[m]) continue;
    r.paid[m] = recDate(r, m); delta += sgn(r.type) * recAmt(r, m);
  }
  return delta;
}
(function migrate(){ const fresh = !S.v || S.v < 3; const delta = normalize(S); if (fresh){ S.opening = (+S.opening || 0) - delta; S.v = 3; } else S.opening -= delta; save(); })();

/* veri paketi ekleme: mevcut kayıtlar silinmez, aynı kimlikli kayıt varsa atlanır (mükerrer olmaz),
   geçmiş aylara ait kayıtlar kasayı değiştirmez */
const DKEYS = ['tx','rec','debts','subs','cards'];
function mergeData(d){
  const add = {tx:[], rec:[], debts:[], subs:[], cards:[]}; let n = 0, skip = 0;
  for (const k of DKEYS) for (const it of (d[k]||[])){ if (S[k].some(x => x.id === it.id)) skip++; else { add[k].push(JSON.parse(JSON.stringify(it))); n++; } }
  S.opening -= normalize(add);
  for (const k of DKEYS) S[k].push(...add[k]);
  return {n, skip};
}
// gömülü başlangıç verileri (veriler.js) — her paket yalnızca bir kez eklenir
(function seed(){
  const d = window.CF_SEED; if (!d || !d.id) return;
  S.seeds = S.seeds || []; if (S.seeds.includes(d.id)) return;
  mergeData(d); S.seeds.push(d.id); save();
})();

/* =========================================================
   HAREKETLER — her şey "kalem" (item) olarak
   key: t:<id>  r:<id>@<ay>  d:<id>  dp:<id>:<öd>  c:<id>  cp:<id>:<öd>
   ========================================================= */
function txItem(t){ const c = catOf(t.type, t.cat);
  return {key:'t:'+t.id, src:'tx', id:t.id, type:t.type, cat:t.cat, title: t.note || c.n, sub: t.note ? c.n : (t.type==='in'?'Gelir':'Gider'), amount:+t.amount, date:t.date, done:!!t.done, doneDate:t.doneDate}; }
function recItem(r, ym){ const c = catOf(r.type, r.cat);
  return {key:`r:${r.id}@${ym}`, src:'rec', id:r.id, ym, type:r.type, cat:r.cat, title: r.note || c.n, sub: recInfo(r, ym), rec:true, amount:recAmt(r, ym), date:recDate(r, ym), done:!!(r.paid && r.paid[ym]), doneDate: r.paid ? r.paid[ym] : ''}; }
function debtPend(d){ const b = d.kind === 'borc';
  return {key:'d:'+d.id, src:'debt', id:d.id, type: b?'out':'in', cat: b?'borc':'alacak', title:d.person, sub: (b?'Borç':'Alacak') + (paidOf(d) ? ` · kalan` : ''), amount:remOf(d), date:d.date || '', done:false}; }
function debtPay(d, p){ const b = d.kind === 'borc';
  return {key:`dp:${d.id}:${p.id}`, src:'debtpay', id:d.id, pid:p.id, type: b?'out':'in', cat: b?'borc':'alacak', title:d.person, sub: b?'Borç ödemesi':'Alacak tahsilatı', amount:+p.amount, date:p.date, done:true, doneDate:p.date}; }
function cardPend(c){ return {key:'c:'+c.id, src:'card', id:c.id, type:'out', cat:'kk', title:c.name, sub: `${MONTHS[+c.month.slice(5)-1]} ekstresi` + (paidOf(c) ? ' · kalan' : ''), amount:remOf(c), date: c.due || `${c.month}-${pad(dim(c.month))}`, done:false}; }
function cardPay(c, p){ return {key:`cp:${c.id}:${p.id}`, src:'cardpay', id:c.id, pid:p.id, type:'out', cat:'kk', title:c.name, sub:`${MONTHS[+c.month.slice(5)-1]} ekstresi ödemesi`, amount:+p.amount, date:p.date, done:true, doneDate:p.date}; }

// bir ayın tüm kalemleri (bekleyen + tamamlanan)
function itemsOf(ym){
  const L = [];
  for (const t of S.tx) if (t.date && t.date.startsWith(ym)) L.push(txItem(t));
  for (const r of S.rec) if (recActive(r, ym)) L.push(recItem(r, ym));
  for (const d of S.debts){
    for (const p of d.pays || []) if (p.date.startsWith(ym)) L.push(debtPay(d, p));
    if (!isClosed(d) && d.date && d.date.startsWith(ym)) L.push(debtPend(d));
  }
  for (const c of S.cards) if (c.month === ym){
    for (const p of c.pays || []) L.push(cardPay(c, p));
    if (!isClosed(c)) L.push(cardPend(c));
  }
  return L;
}
// bekleyenler: seçili ay + (bu ay ise) geçmiş aylardan kalan gecikmişler
function pendingFor(ym){
  let L = itemsOf(ym).filter(x => !x.done);
  if (ym === curYM()){
    for (let m = addMonth(ym, -24); m < ym; m = addMonth(m, 1)) L = itemsOf(m).filter(x => !x.done).concat(L);
  }
  return L.sort((a,b) => (a.date||'9').localeCompare(b.date||'9'));
}
// kasa = açılış + tamamlanan tüm hareketler
function allDone(){
  const L = [];
  for (const t of S.tx) if (t.done) L.push(txItem(t));
  for (const r of S.rec) for (const ym in (r.paid||{})) L.push(recItem(r, ym));
  for (const d of S.debts) for (const p of d.pays||[]) L.push(debtPay(d, p));
  for (const c of S.cards) for (const p of c.pays||[]) L.push(cardPay(c, p));
  return L;
}
const kasa = () => (+S.opening || 0) + sum(allDone(), x => sgn(x.type) * x.amount);
function monthStats(ym){
  const L = itemsOf(ym), f = (ty, dn) => sum(L.filter(x => x.type === ty && x.done === dn));
  return {L, inDone: f('in', true), inPend: f('in', false), outDone: f('out', true), outPend: f('out', false)};
}

/* ---------- işaretleme ---------- */
function getItem(key){
  const i = key.indexOf(':'), p = key.slice(0, i), rest = key.slice(i+1);
  if (p === 't'){ const t = S.tx.find(x => x.id === rest); return t && txItem(t); }
  if (p === 'r'){ const [id, ym] = rest.split('@'); const r = S.rec.find(x => x.id === id); return r && recItem(r, ym); }
  if (p === 'd'){ const d = S.debts.find(x => x.id === rest); return d && debtPend(d); }
  if (p === 'c'){ const c = S.cards.find(x => x.id === rest); return c && cardPend(c); }
  if (p === 'dp' || p === 'cp'){ const [id, pid] = rest.split(':'); const o = (p === 'dp' ? S.debts : S.cards).find(x => x.id === id); const py = o && (o.pays||[]).find(x => x.id === pid); return py && (p === 'dp' ? debtPay(o, py) : cardPay(o, py)); }
}
function doPay(key, amount, date){
  const it = getItem(key); if (!it) return;
  if (it.src === 'tx'){ const t = S.tx.find(x => x.id === it.id); t.done = true; t.doneDate = date; t.amount = amount; }
  else if (it.src === 'rec'){ const r = S.rec.find(x => x.id === it.id); r.paid = r.paid || {}; r.paid[it.ym] = date; r.over = r.over || {};
    if (Math.abs(amount - +r.amount) < .005) delete r.over[it.ym]; else r.over[it.ym] = amount; }
  else if (it.src === 'debt'){ const d = S.debts.find(x => x.id === it.id); (d.pays = d.pays || []).push({id: uid(), date, amount}); }
  else if (it.src === 'card'){ const c = S.cards.find(x => x.id === it.id); (c.pays = c.pays || []).push({id: uid(), date, amount}); }
  save(); render();
  toast(it.type === 'in' ? `Alındı · kasaya +${moneyShort(amount)}` : `Ödendi · kasadan −${moneyShort(amount)}`, () => undoPay(it.src === 'debt' || it.src === 'card' ? lastPayKey(it) : key, true));
}
function lastPayKey(it){ const o = (it.src === 'debt' ? S.debts : S.cards).find(x => x.id === it.id); const p = o.pays[o.pays.length-1]; return `${it.src === 'debt' ? 'dp' : 'cp'}:${o.id}:${p.id}`; }
function undoPay(key, silent){
  const it = getItem(key); if (!it) return;
  if (it.src === 'tx'){ const t = S.tx.find(x => x.id === it.id); t.done = false; t.doneDate = ''; }
  else if (it.src === 'rec'){ const r = S.rec.find(x => x.id === it.id); delete r.paid[it.ym]; }
  else if (it.src === 'debtpay' || it.src === 'cardpay'){ const o = (it.src === 'debtpay' ? S.debts : S.cards).find(x => x.id === it.id); o.pays = o.pays.filter(x => x.id !== it.pid); }
  save(); render(); if (!silent) toast(it.type === 'in' ? 'Geri alındı · kasadan çıkarıldı' : 'Geri alındı · kasaya iade edildi');
}

const st = { tab:'home', month: curYM(), cardMonth: curYM(), debtKind:'borc', txFilter:'all', detail:false, hide: localStorage.getItem(HIDE_KEY) === '1' };

function ring(a, b){
  const R = 56, C = 2*Math.PI*R, tot = a + b; let s = '';
  if (tot > 0){ const gap = (a > 0 && b > 0) ? 20 : 0, la = C*a/tot, lb = C*b/tot;
    if (a > 0) s += `<circle cx="70" cy="70" r="${R}" stroke="var(--ink)" stroke-dasharray="${Math.max(la-gap,.01)} ${C}" stroke-dashoffset="${-gap/2}"/>`;
    if (b > 0) s += `<circle cx="70" cy="70" r="${R}" stroke="var(--orange)" stroke-dasharray="${Math.max(lb-gap,.01)} ${C}" stroke-dashoffset="${-(la+gap/2)}"/>`; }
  return `<svg class="ring" viewBox="0 0 140 140"><g transform="rotate(-90 70 70)"><circle cx="70" cy="70" r="${R}" stroke="rgba(0,0,0,.08)"/>${s}</g></svg>`;
}
function amtSize(txt, max = 60){ return Math.min(max, Math.floor(318 / (txt.length * 0.55))); }
function stackCards(list, kind, limit){
  const pal = kind === 'out' ? ['y','o','g'] : ['k','t','w'];
  return list.slice(0, limit).map((it, i) => {
    const txt = (it.type === 'in' ? '+' : '−') + moneyShort(it.amount);
    const late = it.date && it.date < todayStr();
    const dl = it.date ? (late ? (it.type === 'in' ? `<em>Bekleniyor</em> · ${dayLabel(it.date)}` : `<em>${-daysTo(it.date)} gün gecikti</em>`) : daysTo(it.date) === 0 ? '<em>Bugün</em>' : dayLabel(it.date)) : '';
    return `<button class="sc sc-${pal[i % 3]}" style="z-index:${i+1}" data-act="item" data-key="${it.key}">
      <div class="h"><b>${esc(upper(it.title))}</b>${i === 0 ? `<span class="go">${I.ur}</span>` : ''}</div>
      <div class="f"><small>${[dl, esc(it.sub)].filter(Boolean).join(' · ')}</small><span class="a" style="font-size:${amtSize(txt)}px">${txt}</span></div>
    </button>`; }).join('');
}

function dueBadge(d, closed){
  if (closed) return `<span class="badge ok">Kapandı</span>`;
  if (!d) return '';
  const n = daysTo(d);
  if (n < 0) return `<span class="badge late">${-n} gün geçti</span>`;
  if (n === 0) return `<span class="badge late">Bugün</span>`;
  if (n <= 7) return `<span class="badge soon">${n} gün kaldı</span>`;
  return `<span class="badge">${dayLabel(d)}</span>`;
}
function debtRow(d){

    ${key ? `<button class="chk ${b ? 'co' : 'ci'} ${closed ? 'on' : ''}" data-act="tick" data-key="${key}" aria-label="${b ? 'Ödedim' : 'Tahsil ettim'}">${I.check}</button>` : `<span class="chk on">${I.check}</span>`}

    </button>
    <button class="a" data-act="edit-debt" data-id="${d.id}"><b>${moneyPlain(closed ? +d.amount : remOf(d))}</b><small>${paid > 0 && !closed ? '/ ' + moneyShort(+d.amount) : dueBadge(d.date, closed)}</small></button>

}

let F = null;
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
function openSheet(html){ sheet.innerHTML = `<div class="grab"></div>` + html; sheet.scrollTop = 0; sheet.classList.add('open'); scrim.classList.add('open'); }
function closeSheet(){ sheet.classList.remove('open'); scrim.classList.remove('open'); F = null; }
function syncF(){ if (!F) return; sheet.querySelectorAll('[data-f]').forEach(el => F[el.dataset.f] = el.value); }

/* ---------- kalem: Aldım / Ödedim ---------- */
function openItem(key){
  const it = getItem(key); if (!it) return;
  const inn = it.type === 'in', c = catOf(it.type, it.cat);
  const editAct = it.src === 'tx' ? `data-act="edit-tx" data-id="${it.id}"` : it.src === 'rec' ? `data-act="edit-tx" data-id="${it.id}@${it.ym}"` :
    (it.src === 'debt' || it.src === 'debtpay') ? `data-act="edit-debt" data-id="${it.id}"` : `data-act="edit-card" data-id="${it.id}"`;
  const heroCls = inn ? 'background:var(--ink);color:#fff' : it.cat === 'kk' ? 'background:var(--yellow)' : 'background:var(--orange);color:#fff';
  if (it.done){
    openSheet(`<h2>${esc(it.title)}</h2>
      <div class="hero" style="${heroCls}"><small>${inn ? 'Alındı' : 'Ödendi'} · ${dayLabel(it.doneDate || it.date)} ${(it.doneDate || it.date).slice(0,4)}</small><b>${inn ? '+' : '−'}${moneyShort(it.amount)}</b><p>${esc(c.n)} · ${esc(it.sub)}</p></div>
      <button class="btn line" data-act="undo-item" data-key="${key}">Geri al (${inn ? 'kasadan çıkar' : 'kasaya iade et'})</button>
      ${it.src === 'debtpay' || it.src === 'cardpay' ? '' : `<button class="btn line" ${editAct}>Kaydı düzenle</button>`}`);
    return;
  }
  F = {kind:'pay', key, amount: amtInput(it.amount), date: todayStr()};
  openSheet(`<h2>${esc(it.title)}</h2>
    <p class="hint" style="margin-top:4px">${esc(c.n)} · ${esc(it.sub)}${it.date ? ' · ' + (it.type === 'in' ? 'beklenen ' : 'son gün ') + dayLabel(it.date) : ''}</p>
    <div class="amt"><span>₺</span><input data-f="amount" inputmode="decimal" value="${esc(F.amount)}" autocomplete="off"></div>
    <label class="fl"><small>${inn ? 'Alındığı gün' : 'Ödeme günü'}</small><input class="in" type="date" data-f="date" value="${F.date}"></label>
    ${it.src === 'debt' || it.src === 'card' ? `<p class="hint">Kalan: ${moneyPlain(it.amount)}. Daha az yazarsan kısmi ödeme olarak kaydedilir.</p>` : ''}
    <button class="btn ${inn ? '' : 'o'}" data-act="confirm-pay">${inn ? 'Aldım · kasaya ekle' : 'Ödedim · kasadan düş'}</button>
    <button class="btn line" ${editAct}>Kaydı düzenle</button>`);
}
function confirmPay(){
  syncF(); const a = parseAmt(F.amount);
  if (!(a > 0)) return toast('Tutar gir'); if (!F.date) return toast('Tarih seç');
  const key = F.key, date = F.date || todayStr(); closeSheet(); doPay(key, a, date);
}

function payList(pays, title, pre, id, rem, pendKey, btnTxt){
  return `<div class="grp"><span>${title}</span><span>${pays.length ? moneyShort(sum(pays)) : ''}</span></div>
    <div class="list">${pays.map(p => `<div class="row"><div class="t"><b>${moneyPlain(p.amount)}</b><small>${dayLabel(p.date)} ${p.date.slice(0,4)}</small></div><button class="ib soft" data-act="undo-item" data-key="${pre}:${id}:${p.id}" aria-label="Ödemeyi sil">${I.x}</button></div>`).join('') || '<p class="hint" style="margin:6px 2px">Henüz ödeme yok.</p>'}</div>
    ${rem > 0 ? `<button class="btn line" data-act="item" data-key="${pendKey}">${btnTxt} · kalan ${moneyShort(rem)}</button>` : ''}`;
}
function showForm(){ openSheet(formHTML()); }
function refreshForm(){ const top = sheet.scrollTop; sheet.innerHTML = `<div class="grab"></div>` + formHTML(); sheet.scrollTop = top; }

const COLL = {tx:'tx', debt:'debts', sub:'subs', card:'cards'};
function openForm(kind, id, preset = {}){
  const t = todayStr();
  if (kind === 'tx' && (id && id.includes('@') || preset.rid)){
    const [rid, ym] = preset.rid ? [preset.rid, null] : id.split('@');
    const r = S.rec.find(x => x.id === rid); if (!r) return;
    F = {kind, rid, ym, scope: ym ? 'this' : 'all', type: r.type, cat: r.cat, amount: amtInput(ym ? recAmt(r, ym) : r.amount),
      note: r.note || '', rep:'monthly', start: r.start, day: String(r.day || 1), endMode: r.mode || (r.end ? 'month' : 'none'), end: r.end || '', count: r.tTotal ? String(r.tTotal) : ''};
    showForm(); return;
  }
  const item = id ? S[COLL[kind]].find(x => x.id === id) : null;
  if (kind === 'tx'){
    const type = item?.type || preset.type || 'out';
    const date = item?.date || (st.month === ymOf(t) ? t : st.month + '-01');
    F = {kind, id, type, cat: item?.cat || CATS[type][0].k, amount: amtInput(item?.amount), date, note: item?.note || '',
      rep: preset.rep || 'once', start: ymOf(date), day: String(+date.slice(8)), endMode:'none', end:'', count:'', done: item ? (item.done ? 'yes' : 'no') : (date <= t ? 'yes' : 'no')};
  } else if (kind === 'debt'){
    F = {kind, id, dk: item?.kind || st.debtKind, amount: amtInput(item?.amount), person: item?.person || '', date: item?.date || '', note: item?.note || ''};
  } else if (kind === 'sub'){
    F = {kind, id, name: item?.name || '', amount: amtInput(item?.amount), period: item?.period || 'ay', day: item?.day || '', month: item?.month || ''};
  } else if (kind === 'card'){
    F = {kind, id, name: item?.name || '', amount: amtInput(item?.amount), month: item?.month || st.cardMonth, due: item?.due || ''};
  }
  showForm();
  if (!id) setTimeout(() => sheet.querySelector('[data-f="amount"]')?.focus({preventScroll:true}), 350);
}

function saveForm(){
  syncF();
  const amount = parseAmt(F.amount);
  if (!(amount > 0)) return toast('Tutar gir');
  if (F.kind === 'tx' && (F.rid || F.rep === 'monthly')) return saveRec(amount);
  const coll = S[COLL[F.kind]]; let rec;
  if (F.kind === 'tx'){
    if (!F.date) return toast('Tarih seç');
    const done = F.done === 'yes';
    rec = {type: F.type, cat: F.cat, amount, date: F.date, note: F.note.trim(), done, doneDate: done ? (F.date <= todayStr() ? F.date : todayStr()) : '', _v3: 1};
  } else if (F.kind === 'debt'){
    if (!F.person.trim()) return toast(F.dk === 'borc' ? 'Kime borçlu olduğunu yaz' : 'Kimden alacaklı olduğunu yaz');
    rec = {kind: F.dk, person: F.person.trim(), amount, date: F.date, note: F.note.trim(), _v3: 1};
  } else if (F.kind === 'sub'){
    if (!F.name.trim()) return toast('Abonelik adını yaz');
    const day = parseInt(F.day);
    rec = {name: F.name.trim(), amount, period: F.period, day: day >= 1 && day <= 31 ? day : '', month: F.period === 'yil' && F.month ? +F.month : ''};
  } else if (F.kind === 'card'){
    if (!F.name.trim()) return toast('Kart adını yaz'); if (!F.month) return toast('Ekstre ayını seç');
    rec = {name: F.name.trim(), amount, month: F.month, due: F.due, _v3: 1};
  }
  if (F.id) Object.assign(coll.find(x => x.id === F.id), rec);
  else coll.push({id: uid(), ts: Date.now(), ...(F.kind === 'debt' || F.kind === 'card' ? {pays: [], closed: false} : {}), ...rec});
  if (F.kind === 'tx') st.month = ymOf(rec.date);
  if (F.kind === 'card') st.cardMonth = rec.month;
  if (F.kind === 'debt') st.debtKind = rec.kind;
  save(); const wasEdit = !!F.id; closeSheet(); render(); toast(wasEdit ? 'Güncellendi' : 'Eklendi');
}

/* düzenli kayıt kaydetme — scope: this (sadece o ay) · future (o aydan itibaren, seri bölünür) · all (tüm seri) */
function saveRec(amount){
  const done = msg => { save(); const back = F.fromList; closeSheet(); render(); toast(msg); if (back) openRecList(); };
  if (F.scope === 'this'){
    const r = S.rec.find(x => x.id === F.rid); r.over = r.over || {};
    if (Math.abs(amount - +r.amount) < .005) delete r.over[F.ym]; else r.over[F.ym] = amount;
    return done(`${MONTHS[+F.ym.slice(5)-1]} güncellendi`);
  }
  const start = F.scope === 'future' ? F.ym : F.start;
  if (!start) return toast('Başlangıç ayını seç');
  const day = parseInt(F.day); if (!(day >= 1 && day <= 31)) return toast('Ayın gününü 1–31 arası yaz');
  const old = F.rid ? S.rec.find(x => x.id === F.rid) : null;
  let end = '', extra = {mode: F.endMode, tStart: '', tTotal: ''};
  if (F.endMode === 'month'){ if (!F.end) return toast('Son ayı seç'); end = F.end; }
  if (F.endMode === 'count'){
    const n = parseInt(F.count); if (!(n >= 1 && n <= 600)) return toast('Taksit sayısını yaz');
    const t0 = (old && old.mode === 'count' && F.scope !== 'all' && old.tStart) ? old.tStart : start;
    end = addMonth(t0, n - 1); extra = {mode:'count', tStart: t0, tTotal: n};
  }
  if (end && end < start) return toast('Son ay başlangıçtan önce olamaz');
  const fields = {type: F.type, cat: F.cat, amount, day, start, end, note: F.note.trim(), ...extra};

  if (!F.rid){
    if (F.id) S.tx = S.tx.filter(x => x.id !== F.id); // tek seferlik kaydı düzenliye çevir
    const r = {id: uid(), ts: Date.now(), skip: [], over: {}, paid: {}, _v3: 1, ...fields};
    S.opening -= autoPast(r); // geçmiş aylar kasayı değiştirmesin
    S.rec.push(r);
    st.month = start <= st.month && (!end || st.month <= end) ? st.month : (start > curYM() ? start : curYM());
    return done('Düzenli kayıt eklendi');
  }
  const r = old;
  const split = (map, keep) => { const a = {}, b = {}; for (const [m, v] of Object.entries(map||{})) (m >= start ? b : a)[m] = v; return keep ? a : b; };
  if (F.scope === 'all' || start <= r.start){
    Object.assign(r, fields);
    if (F.scope === 'all'){ const inR = m => m >= start && (!end || m <= end); r.skip = (r.skip||[]).filter(inR);
      for (const m in (r.paid||{})) if (!inR(m)) delete r.paid[m]; }
    for (const m in (r.over||{})) if (+r.over[m] === amount) delete r.over[m];
  } else {
    const nr = {id: uid(), ts: Date.now(), _v3: 1, ...fields, skip: (r.skip||[]).filter(m => m >= start), over: split(r.over, false), paid: split(r.paid, false)};
    for (const m in nr.over) if (+nr.over[m] === amount) delete nr.over[m];
    r.end = addMonth(start, -1); r.skip = (r.skip||[]).filter(m => m < start); r.over = split(r.over, true); r.paid = split(r.paid, true);
    S.rec.push(nr);
  }
  done('Güncellendi');
}

function delItem(){
  if (!F._confirm){ syncF(); F._confirm = true; refreshForm(); return; }
  const back = F.fromList;
  if (F.kind === 'tx' && F.rid){
    const r = S.rec.find(x => x.id === F.rid);
    const msg = F.scope === 'this' ? 'Bu ay atlandı' : (F.scope === 'future' && F.ym > r.start) ? 'Sonlandırıldı' : 'Silindi';
    if (F.scope === 'this'){ r.skip = [...new Set([...(r.skip||[]), F.ym])]; if (r.over) delete r.over[F.ym]; if (r.paid) delete r.paid[F.ym]; }
    else if (F.scope === 'future' && F.ym > r.start){ r.end = addMonth(F.ym, -1); for (const m in (r.paid||{})) if (m >= F.ym) delete r.paid[m]; }
    else S.rec = S.rec.filter(x => x.id !== F.rid);
    save(); closeSheet(); render(); toast(msg); if (back) openRecList(); return;
  }
  const coll = COLL[F.kind]; S[coll] = S[coll].filter(x => x.id !== F.id);
  save(); closeSheet(); render(); toast('Silindi');
}

function openRecList(){
  const now = curYM();
  const row = r => { const c = catOf(r.type, r.cat), ended = r.end && r.end < now;
    return `<button class="row" data-act="edit-rec" data-id="${r.id}" style="${ended ? 'opacity:.45' : ''}">
      <div class="av ${r.type==='in' ? '' : 'o'}">${I[c.i]}</div>
      <div class="t"><b>${esc(r.note || c.n)}</b><small>${r.note && r.note !== c.n ? c.n + ' · ' : ''}ayın ${r.day}'i · ${ended ? 'bitti' : r.start > now ? ymShort(r.start) + ' itibarıyla' : recInfo(r, now)}</small></div>
      <div class="a"><b>${r.type==='in' ? '+' : '−'}${moneyPlain(r.amount)}</b><small>${r.end ? 'son ay ' + ymShort(r.end) : 'aylık'}</small></div>
    </button>`; };
  const act = S.rec.filter(r => !r.end || r.end >= now), old = S.rec.filter(r => r.end && r.end < now);
  const sorter = (a,b) => (a.type === b.type ? 0 : a.type === 'in' ? -1 : 1) || b.amount - a.amount;
  openSheet(`<div class="sh"><h2>Düzenli kayıtlar</h2><button class="ib dark" data-act="add-rec" aria-label="Ekle">${I.plus}</button></div>
    <p class="hint" style="margin-top:0">Her ay ilgili aya eklenir; "Aldım / Ödedim" dediğinde kasaya işlenir.</p>
    <div class="list">${act.sort(sorter).map(row).join('') || `<div class="empty"><b>Düzenli kayıt yok</b>Maaş, kira, kredi taksiti gibi her ay tekrarlananları + ile ekle.</div>`}</div>
    ${old.length ? `<div class="grp"><span>Bitenler</span></div><div class="list">${old.map(row).join('')}</div>` : ''}`);
}

  openSheet(`<h2>Menü</h2>
    <div class="list menu">
      <button class="row" data-act="kasa-fix"><div class="av">${I.safe}</div><div class="t"><b>Kasayı düzelt</b><small>Kasadaki gerçek tutarı gir</small></div></button>
      <button class="row" data-act="export"><div class="av y">${I.dl}</div><div class="t"><b>Yedeği indir</b><small>${n} kayıt · JSON dosyası</small></div></button>
      <button class="row" data-act="import"><div class="av g">${I.ul}</div><div class="t"><b>Yedekten yükle</b><small>Yedek ya da veri paketi seç</small></div></button>
      <button class="row" data-act="wipe"><div class="av o">${I.trash}</div><div class="t"><b id="wipeT">Tüm verileri sil</b><small>Geri alınamaz</small></div></button>
    </div>
    <p class="hint">Verilerin yalnızca bu telefonda saklanır. Telefon değiştirmeden önce yedeği indir.<br><br>Kurulum: iPhone'da Safari → Paylaş → <b>Ana Ekrana Ekle</b>; Android'de Chrome → ⋮ → <b>Uygulamayı yükle</b>.</p>`);
}
function doExport(){
  const blob = new Blob([JSON.stringify({app:'cf', exported: new Date().toISOString(), ...S}, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `cf-yedek-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Yedek indirildi');
}
document.getElementById('fileIn').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || !DKEYS.some(k => Array.isArray(d[k]))) throw 0;
      if (d.merge){
        const {n, skip} = mergeData(d);
        save(); closeSheet(); render(); toast(`${n} kayıt eklendi${skip ? ` · ${skip} zaten vardı` : ''}`);
      } else {
        const seeds = S.seeds; S = Object.assign(blank(), d); S.seeds = d.seeds || seeds; const delta = normalize(S); if (!d.v || d.v < 3) S.opening = (+S.opening||0) - delta; S.v = 3;
        save(); closeSheet(); render(); toast('Yedek yüklendi');
      }
    } catch(err){ toast('Dosya okunamadı'); }
  };
  rd.readAsText(f); e.target.value = '';
});

/* ---------- olaylar ---------- */
document.getElementById('fab').innerHTML = I.plus;
document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]');
  if (tb){ if (st.tab !== tb.dataset.tab){ st.tab = tb.dataset.tab; render(true); window.scrollTo({top:0}); } return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, key = el.dataset.key;
  switch (a){
    case 'pm': st.month = addMonth(st.month, -1); render(); break;
    case 'nm': st.month = addMonth(st.month, 1); render(); break;
    case 'pcm': st.cardMonth = addMonth(st.cardMonth, -1); render(); break;
    case 'ncm': st.cardMonth = addMonth(st.cardMonth, 1); render(); break;
    case 'open-detail': st.detail = true; if (el.dataset.f) st.txFilter = el.dataset.f; render(); document.getElementById('detail').classList.add('open'); document.getElementById('detail').scrollTop = 0; break;
    case 'close-detail': st.detail = false; document.getElementById('detail').classList.remove('open'); render(); break;
    case 'txf': st.txFilter = el.dataset.v; render(); break;
    case 'dk': st.debtKind = el.dataset.v; render(); break;
    case 'hide': st.hide = !st.hide; localStorage.setItem(HIDE_KEY, st.hide ? '1' : '0'); render(); break;
    case 'fab':
      if (st.detail || st.tab === 'home') openForm('tx', null, {type: st.detail && st.txFilter === 'in' ? 'in' : 'out'});
      else if (st.tab === 'debts') openForm('debt'); else if (st.tab === 'subs') openForm('sub'); else openForm('card');
      break;
    case 'add-tx': openForm('tx', null, {type: el.dataset.type || 'out'}); break;
    case 'edit-tx': openForm('tx', id); break;
    case 'rec-list': openRecList(); break;
    case 'add-rec': openForm('tx', null, {type:'out', rep:'monthly'}); F.fromList = true; break;
    case 'edit-rec': openForm('tx', null, {rid: id}); F.fromList = true; break;
    case 'add-debt': openForm('debt'); break;
    case 'edit-debt': openForm('debt', id); break;
    case 'add-sub': openForm('sub'); break;
    case 'edit-sub': openForm('sub', id); break;
    case 'add-card': openForm('card'); break;
    case 'edit-card': openForm('card', id); break;
    case 'item': openItem(key); break;
    case 'tick': tick(key); break;
    case 'confirm-pay': confirmPay(); break;
    case 'undo-item': { const it = getItem(key); closeSheet(); undoPay(key); break; }
    case 'undo': if (undoFn){ const f = undoFn; undoFn = null; f(); document.getElementById('toast').classList.remove('show'); toast('Geri alındı'); } break;
    case 'fset': syncF(); F[el.dataset.k] = el.dataset.v; if (el.dataset.k === 'type') F.cat = CATS[F.type][0].k;
      if (el.dataset.k === 'rep' && el.dataset.v === 'monthly' && F.date){ F.start = ymOf(F.date); F.day = String(+F.date.slice(8)); }
      F._confirm = false; refreshForm(); break;
    case 'save': saveForm(); break;
    case 'del': delItem(); break;
    case 'close': closeSheet(); break;
    case 'menu': openMenu(); break;
    case 'kasa-log': openKasaLog(); break;
    case 'kasa-fix': openKasaFix(); break;
    case 'kasa-save': kasaSave(); break;
    case 'export': doExport(); break;
    case 'import': document.getElementById('fileIn').click(); break;
    case 'wipe': {
      const t = document.getElementById('wipeT');
      if (!el._c){ el._c = true; t.textContent = 'Emin misin? Tekrar dokun'; t.style.color = 'var(--orange)'; return; }
      { const seeds = S.seeds; S = blank(); S.seeds = seeds; } save(); closeSheet(); render(); toast('Tüm veriler silindi'); break;
    }
  }
});
sheet.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input')) { e.preventDefault(); if (F && F.kind === 'pay') confirmPay(); else if (F && F.kind === 'kasa') kasaSave(); else if (F) saveForm(); } });
(() => { let y0 = null;
  sheet.addEventListener('touchstart', e => { y0 = sheet.scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive:true});
  sheet.addEventListener('touchmove', e => { if (y0 === null) return; const dy = e.touches[0].clientY - y0; if (dy > 0){ sheet.style.transition = 'none'; sheet.style.transform = `translate(-50%, ${dy}px)`; } }, {passive:true});
  sheet.addEventListener('touchend', e => { if (y0 === null) return; const dy = e.changedTouches[0].clientY - y0; sheet.style.transition = ''; sheet.style.transform = ''; if (dy > 110) closeSheet(); y0 = null; });
})();
window.addEventListener('keydown', e => { if (e.key === 'Escape'){ if (sheet.classList.contains('open')) closeSheet(); else if (st.detail){ st.detail = false; document.getElementById('detail').classList.remove('open'); render(); } } });

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
